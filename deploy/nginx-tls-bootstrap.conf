server {
    listen 80;
    listen [::]:80;
    server_name agent.wallettracker.app;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.wallettracker.app;

    ssl_certificate /etc/ssl/wallet-social-dashboard/origin.crt;
    ssl_certificate_key /etc/ssl/wallet-social-dashboard/origin.key;

    auth_basic "Wallet Tracker Operations";
    auth_basic_user_file /etc/nginx/.wallet-social-dashboard.htpasswd;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
